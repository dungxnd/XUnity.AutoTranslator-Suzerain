# LLMConfig.yaml — shared configuration for the OpenAiTranslate, OllamaTranslate, LmStudioTranslate, and IndexTranslate endpoints.
# Select the endpoint in Config.ini:
#
#   [Service]
#   Endpoint=LmStudioTranslate
#   FallbackEndpoint=
#
# Endpoint URLs:
#   OpenAI:    https://api.openai.com/v1/chat/completions  (apiKeyRequired: true)
#   Ollama:    http://localhost:11434/api/chat             (apiKeyRequired: false)
#   LM Studio: http://localhost:1234/v1/chat/completions   (apiKeyRequired: false)
#   Index:     https://index-translate.bilibili.com/v1/chat/completions (default for IndexTranslate; apiKeyRequired: false)
#
# All settings for all four endpoints live in this file. The in-game
# Advanced window edits these values in place.
#
# IndexTranslate uses the model's native translation prompt and defaults to
# the free public API. systemPrompt and glossaryPrompt are ignored in that
# mode. Recommended Index modelParams: temperature: 0, max_tokens: 4096.
#
# url/model below are used by OpenAiTranslate, OllamaTranslate, and LmStudioTranslate.
# IndexTranslate uses the public API unless you uncomment its overrides below.

apiKey: "None"
apiKeyRequired: false
url: "http://localhost:1234/v1/chat/completions"
model: "model-identifier"

# Optional IndexTranslate overrides. Leave commented out to use the free public API.
# indexTranslateUrl: "http://127.0.0.1:8000/v1/chat/completions"
# indexTranslateModel: "IndexTeam/Index-Translate-9B"

# Batching: short lines are grouped to amortize the system prompt.
# Long texts are sent on their own and split into smaller blocks when needed.
# Set a character limit to 0 or lower to disable that limit.
maxTranslationsPerRequest: 12
maxCharactersPerRequest: 4000
maxCharactersPerTranslation: 2000

# max_tokens is sent to OpenAI/LM Studio and mapped to Ollama's num_predict.
# For IndexTranslate, temperature 0 is recommended; max_tokens is the response budget.
modelParams:
  temperature: 0.2
  max_tokens: 4096
  top_p: 0.9
  top_k: 40
  frequency_penalty: 0
  presence_penalty: 0

# Used by OpenAI/Ollama/LM Studio. IndexTranslate uses its native prompt instead.
systemPrompt: |
  Translate the source text into fluent English while preserving the original tone and meaning.
  Do not add explanations, notes, markdown, or quotation marks.
  Preserve character names, placeholders, variables, rich-text tags, escaped characters, and line breaks.
  Use the glossary translation exactly when a matching source term appears.

glossaryPrompt: |
  # Glossary for Consistent Translations
  Use the translation for exact matches.
  ## Terms

# Optional glossary entries, matched against the source text.
# IndexTranslate sends matching entries as hard terminology constraints.
glossary:
  - raw: "Example term"
    result: "Example translation"
