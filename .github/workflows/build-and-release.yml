name: Build & Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    name: Build & test
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Enable .NET Framework 3.5
        shell: pwsh
        run: |
          $state = (Get-WindowsOptionalFeature -Online -FeatureName NetFx3).State
          if ($state -ne 'Enabled') {
            Enable-WindowsOptionalFeature -Online -FeatureName NetFx3 -All -NoRestart -WarningAction SilentlyContinue | Out-Null
          }

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $props = [xml](Get-Content -Raw Directory.Build.props)
          $version = @($props.Project.PropertyGroup.Version) | Where-Object { $_ } | Select-Object -First 1
          $version = $version.Trim()
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          if ($tagVersion -ne $version) {
            throw "Tag '${{ github.ref_name }}' does not match the project version '$version' in Directory.Build.props."
          }
          Write-Host "Releasing version $version"

      - name: Restore packages
        run: msbuild XUnity.AutoTranslator.sln /t:Restore /p:Configuration=Release /verbosity:minimal

      - name: Build release
        run: msbuild XUnity.AutoTranslator.sln /m /p:Configuration=Release /verbosity:minimal

      - name: Run unit tests
        run: dotnet test test/XUnity.Common.Tests/XUnity.Common.Tests.csproj --configuration Release --no-build --no-restore --verbosity normal

      - name: Show release archives
        shell: pwsh
        run: Get-ChildItem dist/*.zip | Format-Table Name, Length

      - name: Upload release archives
        uses: actions/upload-artifact@v7
        with:
          name: xunity-auto-translator-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          name: xunity-auto-translator-${{ github.sha }}
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*.zip --title "XUnity.AutoTranslator $TAG" --generate-notes
