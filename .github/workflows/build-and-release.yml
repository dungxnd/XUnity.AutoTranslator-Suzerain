name: Build & Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    name: Build & test
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Enable .NET Framework 3.5
        shell: pwsh
        run: |
          $state = (Get-WindowsOptionalFeature -Online -FeatureName NetFx3).State
          if ($state -ne 'Enabled') {
            Enable-WindowsOptionalFeature -Online -FeatureName NetFx3 -All -NoRestart -WarningAction SilentlyContinue | Out-Null
          }

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $props = [xml](Get-Content -Raw Directory.Build.props)
          $version = @($props.Project.PropertyGroup.Version) | Where-Object { $_ } | Select-Object -First 1
          $version = $version.Trim()
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          if ($tagVersion -ne $version) {
            throw "Tag '${{ github.ref_name }}' does not match the project version '$version' in Directory.Build.props."
          }
          Write-Host "Releasing version $version"

      - name: Restore packages
        run: msbuild XUnity.AutoTranslator.sln /t:Restore /p:Configuration=Release /verbosity:minimal

      - name: Build release
        run: msbuild XUnity.AutoTranslator.sln /m /p:Configuration=Release /verbosity:minimal

      - name: Verify modern managed target (net471)
        run: msbuild src/XUnity.AutoTranslator.Plugin.Core/XUnity.AutoTranslator.Plugin.Core.csproj /t:Build /p:Configuration=Release /p:TargetFramework=net471 /p:SkipILRepack=true /verbosity:minimal

      - name: Run unit tests
        run: dotnet test test/XUnity.Common.Tests/XUnity.Common.Tests.csproj --configuration Release --no-build --no-restore --verbosity normal

      - name: Run core text pipeline tests (net471)
        run: dotnet test test/XUnity.AutoTranslator.Plugin.Core.Tests/XUnity.AutoTranslator.Plugin.Core.Tests.csproj --configuration Release --no-build --no-restore --verbosity normal --filter "FullyQualifiedName~TextHelperTests|FullyQualifiedName~TranslationFileReaderWriterTests|FullyQualifiedName~SimpleTextTranslationCacheTests|FullyQualifiedName~TextTranslationCacheTests"

      - name: Run core text pipeline tests (net8.0)
        run: dotnet test test/XUnity.AutoTranslator.Plugin.Core.TextTests/XUnity.AutoTranslator.Plugin.Core.TextTests.csproj --configuration Release --verbosity normal

      - name: Show release archives
        shell: pwsh
        run: Get-ChildItem dist/*.zip | Format-Table Name, Length

      - name: Upload release archives
        uses: actions/upload-artifact@v7
        with:
          name: xunity-auto-translator-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract changelog
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v version="$version" '
            /^###[[:space:]]+/ {
              if (found) exit
              heading=$0
              sub(/^###[[:space:]]+/, "", heading)
              sub(/^v/, "", heading)
              gsub(/[[:space:]]+$/, "", heading)
              if (heading == version) {
                found=1
                print "### " version
                next
              }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ -s release-notes.md ]; then
            echo "Using CHANGELOG entry for $version."
          else
            echo "No CHANGELOG entry found for $version; release notes will be empty."
          fi

      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          name: xunity-auto-translator-${{ github.sha }}
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -s release-notes.md ]; then
            gh release create "$TAG" dist/*.zip --title "XUnity.AutoTranslator $TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" dist/*.zip --title "XUnity.AutoTranslator $TAG"
          fi
